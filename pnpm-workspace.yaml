packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@swc/core': true
  cbor-extract: true
  esbuild: true
  nx: true
  puppeteer: true
  unrs-resolver: true

catalog:
  '@types/qrcode': ^1.5.6
  jose: ^6.2.3
  qrcode: ^1.5.4
  typescript: ^5.9.3
  vitest: ~4.1.10
  zod: ^4.3.6

catalogs:
  node:
    '@types/node': ^22.19.9
    pino: ^10.0.0
    pino-pretty: ^13.1.1

  fastify:
    '@fastify/autoload': ^6.3.1
    '@fastify/cors': ^11.2.0
    '@fastify/env': ^6.0.0
    '@fastify/formbody': ^8.0.2
    '@fastify/helmet': ^13.0.2
    '@fastify/sensible': ^6.0.3
    '@fastify/static': ^10.1.0
    '@fastify/swagger': ^9.5.2
    '@fastify/swagger-ui': ^5.2.3
    fastify: ^5.12.7
    fastify-plugin: ^5.0.1

  pagopa:
    '@pagopa/io-wallet-oauth2': 1.5.8
    '@pagopa/io-wallet-oid-federation': 1.5.8
    '@pagopa/io-wallet-oid4vci': 1.5.8
    '@pagopa/io-wallet-oid4vp': 1.5.8
    '@pagopa/io-wallet-utils': 1.5.8

cleanupUnusedCatalogs: true
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - '@pagopa/io-wallet-oauth2@1.5.8'
  - '@pagopa/io-wallet-oid-federation@1.5.8'
  - '@pagopa/io-wallet-oid4vci@1.5.8'
  - '@pagopa/io-wallet-oid4vp@1.5.8'
  - '@pagopa/io-wallet-utils@1.5.8'
overrides:
  '@fastify/static@<10.1.2': ^10.1.2
  axios: ^1.20.0
  brace-expansion@<2: ^1.1.21
  brace-expansion@>=2 <3: ^2.1.7
  brace-expansion@>=5: ^5.0.12
  fast-uri@>=3 <4: ^3.1.9
  fast-uri@>=4: ^4.2.3
  follow-redirects: ^1.16.1
  form-data@>=4: ^4.0.6
  js-yaml@>=4 <4.3.2: ^4.3.2
  nanoid@<3.3.19: ^3.3.19
  smol-toml: ^1.9.1
  valibot: ^1.4.2

packageImportMethod: 'clone-or-copy'
