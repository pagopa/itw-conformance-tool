<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autenticazione Completata - IT Wallet</title>

    <!-- Google Fonts - Titillium Web (IO App) + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Design System -->
    <link rel="stylesheet" href="styles/design-system.css" />
    <link rel="stylesheet" href="styles/animations.css" />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-4);
        background: var(--gradient-hero);
      }

      .success-container {
        width: 100%;
        max-width: 800px;
        animation: scaleIn 0.5s ease-out;
      }

      .success-card {
        background: white;
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-2xl);
        padding: var(--space-12) var(--space-8);
        text-align: center;
      }

      /* Success Icon */
      .success-icon-wrapper {
        width: 120px;
        height: 120px;
        margin: 0 auto var(--space-6);
        position: relative;
      }

      .success-icon {
        width: 100%;
        height: 100%;
      }

      .success-circle {
        fill: none;
        stroke: var(--accent-teal);
        stroke-width: 3;
        stroke-dasharray: 166;
        stroke-dashoffset: 166;
        animation: checkmarkCircle 0.6s ease-out forwards;
      }

      .success-checkmark {
        fill: none;
        stroke: var(--accent-teal);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        animation: checkmark 0.4s 0.4s ease-out forwards;
      }

      @keyframes checkmarkCircle {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes checkmark {
        to {
          stroke-dashoffset: 0;
        }
      }

      /* Titles */
      .success-title {
        font-size: var(--text-4xl);
        font-weight: var(--font-bold);
        color: var(--gray-900);
        margin-bottom: var(--space-3);
        animation: fadeInUp 0.5s 0.3s ease-out backwards;
      }

      .success-message {
        font-size: var(--text-lg);
        color: var(--gray-600);
        margin-bottom: var(--space-8);
        line-height: var(--leading-relaxed);
        animation: fadeInUp 0.5s 0.4s ease-out backwards;
      }

      @media (max-width: 640px) {
        .success-title {
          font-size: var(--text-2xl);
        }
        .success-message {
          font-size: var(--text-base);
        }
      }

      /* Credentials Display */
      .credentials-display {
        background: var(--gray-50);
        border-radius: var(--radius-xl);
        padding: var(--space-6);
        margin-bottom: var(--space-8);
        text-align: left;
        animation: fadeInUp 0.5s 0.5s ease-out backwards;
      }

      .credentials-title {
        font-size: var(--text-xl);
        font-weight: var(--font-semibold);
        color: var(--gray-900);
        margin-bottom: var(--space-4);
        text-align: center;
      }

      .credentials-grid {
        display: grid;
        gap: var(--space-4);
      }

      .credential-item {
        background: white;
        border-radius: var(--radius-lg);
        padding: var(--space-4);
        border: 1px solid var(--gray-200);
      }

      .credential-item-header {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        margin-bottom: var(--space-3);
        padding-bottom: var(--space-2);
        border-bottom: 1px solid var(--gray-200);
      }

      .credential-type-badge {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        padding: var(--space-1) var(--space-3);
        background: var(--primary-light);
        color: var(--primary-blue);
        border-radius: var(--radius-full);
        font-size: var(--text-xs);
        font-weight: var(--font-semibold);
      }

      .credential-claims {
        display: grid;
        gap: var(--space-2);
      }

      .claim-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: var(--space-4);
        padding: var(--space-2) 0;
      }

      .claim-key {
        font-size: var(--text-sm);
        color: var(--gray-600);
        font-weight: var(--font-medium);
        min-width: 120px;
      }

      .claim-value {
        font-size: var(--text-sm);
        color: var(--gray-900);
        word-break: break-word;
        text-align: right;
        flex: 1;
      }

      /* Actions */
      .success-actions {
        display: flex;
        gap: var(--space-4);
        justify-content: center;
        flex-wrap: wrap;
        animation: fadeInUp 0.5s 0.6s ease-out backwards;
      }

      .success-actions button,
      .success-actions a {
        min-width: 180px;
      }

      @media (max-width: 640px) {
        .success-actions {
          flex-direction: column;
        }
        .success-actions button,
        .success-actions a {
          width: 100%;
        }
      }

      /* Celebration particles (subtle) */
      .celebration-effects {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: -1;
      }

      .particle {
        position: absolute;
        width: 8px;
        height: 8px;
        background: var(--accent-teal);
        border-radius: 50%;
        opacity: 0;
        animation: particle-float 3s ease-out forwards;
      }

      @keyframes particle-float {
        0% {
          opacity: 0.6;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-100vh) scale(0.5);
        }
      }
    </style>
  </head>
  <body>
    <div class="success-container">
      <div class="success-card">
        <!-- Success Icon with Checkmark Animation -->
        <div class="success-icon-wrapper">
          <svg class="success-icon" viewBox="0 0 52 52">
            <circle class="success-circle" cx="26" cy="26" r="25" />
            <path class="success-checkmark" d="M14 27l7 7 16-16" />
          </svg>
        </div>

        <!-- Title and Message -->
        <h1 class="success-title">Autenticazione Completata!</h1>
        <p class="success-message">Le tue credenziali sono state verificate con successo</p>

        <!-- Credentials Display -->
        <div class="credentials-display">
          <h2 class="credentials-title">Credenziali Ricevute</h2>
          <div id="credentialsCards" class="credentials-grid"></div>
        </div>

        <!-- Actions -->
        <div class="success-actions">
          <button class="button primary" id="homeButton">Torna alla Home</button>
          <button class="button secondary" id="downloadButton">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: inline">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
              ></path>
            </svg>
            Scarica Dati
          </button>
        </div>
      </div>
    </div>

    <!-- Celebration Effects -->
    <div class="celebration-effects" id="celebrationEffects"></div>

    <script>
      function logoutAndGoHome() {
        sessionStorage.clear();
        window.location.href = '/';
      }

      function downloadData() {
        try {
          const values = JSON.parse(sessionStorage.getItem('values'));
          // Filter out portrait value if present
          const filteredValues = values.map((obj) => {
            if (obj.portrait) {
              return { ...obj, portrait: '[Portrait data - omitted from download]' };
            }
            return obj;
          });

          const dataStr = JSON.stringify(filteredValues, null, 2);
          const dataBlob = new Blob([dataStr], { type: 'application/json' });
          const url = URL.createObjectURL(dataBlob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'credentials-' + new Date().toISOString().split('T')[0] + '.json';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        } catch (error) {
          console.error('Download error:', error);
          alert('Errore durante il download dei dati');
        }
      }

      // Create celebration particles
      function createCelebration() {
        const container = document.getElementById('celebrationEffects');
        const colors = ['var(--accent-teal)', 'var(--primary-blue)', 'var(--accent-purple)'];

        for (let i = 0; i < 20; i++) {
          const particle = document.createElement('div');
          particle.classList.add('particle');
          particle.style.left = Math.random() * 100 + '%';
          particle.style.background = colors[Math.floor(Math.random() * colors.length)];
          particle.style.animationDelay = Math.random() * 0.5 + 's';
          particle.style.animationDuration = Math.random() * 1 + 2 + 's';
          container.appendChild(particle);

          // Remove particle after animation
          setTimeout(() => particle.remove(), 3500);
        }
      }

      // Display credentials
      function displayCredentials() {
        try {
          const values = JSON.parse(sessionStorage.getItem('values'));
          if (!values || !Array.isArray(values)) {
            console.warn('No credentials found');
            return;
          }

          const container = document.getElementById('credentialsCards');

          // Group credentials by type
          values.forEach((credential, index) => {
            const item = document.createElement('div');
            item.classList.add('credential-item');

            // Determine credential type
            let credType = 'Credenziale';
            let icon = '📄';

            if (credential.given_name || credential.family_name) {
              if (credential.driving_privileges) {
                credType = 'Patente di Guida (MDL)';
                icon = '🚗';
              } else if (credential.tax_id_code || credential.birth_place) {
                credType = "Carta d'Identità (PID)";
                icon = '🆔';
              }
            } else if (credential.wallet_name) {
              credType = 'Wallet Attestation';
              icon = '📱';
            }

            // Create header
            const header = document.createElement('div');
            header.classList.add('credential-item-header');
            header.innerHTML = `
              <span style="font-size: 1.5rem;">${icon}</span>
              <span class="credential-type-badge">${credType}</span>
            `;
            item.appendChild(header);

            // Create claims list
            const claims = document.createElement('div');
            claims.classList.add('credential-claims');

            Object.entries(credential).forEach(([key, value]) => {
              if (key === 'portrait') {
                value = '[Immagine ritratto]';
              }

              // Format key
              const formattedKey = key.replace(/_/g, ' ').replace(/\b\w/g, (l) => l.toUpperCase());

              const row = document.createElement('div');
              row.classList.add('claim-row');
              row.innerHTML = `
                <span class="claim-key">${formattedKey}</span>
                <span class="claim-value">${value}</span>
              `;
              claims.appendChild(row);
            });

            item.appendChild(claims);
            container.appendChild(item);
          });
        } catch (error) {
          console.error('Error displaying credentials:', error);
          document.getElementById('credentialsCards').innerHTML = `
            <div class="credential-item">
              <p style="text-align: center; color: var(--gray-600);">
                Errore nel caricamento delle credenziali
              </p>
            </div>
          `;
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('homeButton').addEventListener('click', logoutAndGoHome);
        document.getElementById('downloadButton').addEventListener('click', downloadData);
        createCelebration();
        displayCredentials();
      });
    </script>
  </body>
</html>
