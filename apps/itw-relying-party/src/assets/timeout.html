<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sessione Scaduta - IT Wallet</title>

    <!-- Google Fonts - Titillium Web (IO App) + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Design System -->
    <link rel="stylesheet" href="styles/design-system.css" />
    <link rel="stylesheet" href="styles/animations.css" />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-4);
        background: var(--gradient-hero);
      }

      .timeout-container {
        width: 100%;
        max-width: 600px;
        animation: scaleIn 0.4s ease-out;
      }

      .timeout-card {
        background: white;
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-2xl);
        padding: var(--space-12) var(--space-8);
        text-align: center;
      }

      /* Timeout Icon */
      .timeout-icon-wrapper {
        width: 120px;
        height: 120px;
        margin: 0 auto var(--space-6);
        position: relative;
      }

      .timeout-icon {
        width: 100%;
        height: 100%;
        color: var(--warning-500);
        animation: pulse 2s ease-in-out infinite;
      }

      .timeout-circle {
        fill: none;
        stroke: var(--warning-500);
        stroke-width: 3;
        stroke-dasharray: 166;
        stroke-dashoffset: 166;
        animation: timeoutCircle 0.6s ease-out forwards;
      }

      .timeout-clock {
        fill: none;
        stroke: var(--warning-500);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
        animation: fadeIn 0.3s 0.4s ease-out forwards;
      }

      @keyframes timeoutCircle {
        to {
          stroke-dashoffset: 0;
        }
      }

      /* Titles */
      .timeout-title {
        font-size: var(--text-4xl);
        font-weight: var(--font-bold);
        color: var(--grey-900);
        margin-bottom: var(--space-3);
        animation: fadeInUp 0.5s 0.2s ease-out backwards;
      }

      .timeout-message {
        font-size: var(--text-lg);
        color: var(--grey-650);
        margin-bottom: var(--space-6);
        line-height: var(--leading-relaxed);
        animation: fadeInUp 0.5s 0.3s ease-out backwards;
      }

      @media (max-width: 640px) {
        .timeout-title {
          font-size: var(--text-2xl);
        }
        .timeout-message {
          font-size: var(--text-base);
        }
      }

      /* Info Box */
      .timeout-info {
        background: var(--warning-100);
        border-left: 4px solid var(--warning-500);
        border-radius: var(--radius-sm);
        padding: var(--space-4);
        margin-bottom: var(--space-6);
        text-align: left;
        animation: fadeInUp 0.5s 0.4s ease-out backwards;
      }

      .timeout-info-title {
        font-size: var(--text-base);
        font-weight: var(--font-semibold);
        color: var(--grey-900);
        margin-bottom: var(--space-2);
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }

      .timeout-info p {
        font-size: var(--text-sm);
        color: var(--grey-700);
        margin: 0;
        line-height: var(--leading-relaxed);
      }

      /* Actions */
      .timeout-actions {
        display: flex;
        gap: var(--space-4);
        justify-content: center;
        flex-wrap: wrap;
        animation: fadeInUp 0.5s 0.5s ease-out backwards;
      }

      .timeout-actions button,
      .timeout-actions a {
        min-width: 160px;
      }

      @media (max-width: 640px) {
        .timeout-actions {
          flex-direction: column;
        }
        .timeout-actions button,
        .timeout-actions a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="timeout-container">
      <div class="timeout-card">
        <!-- Timeout Icon -->
        <div class="timeout-icon-wrapper">
          <svg class="timeout-icon" viewBox="0 0 52 52">
            <circle class="timeout-circle" cx="26" cy="26" r="25" />
            <g class="timeout-clock">
              <circle cx="26" cy="26" r="10" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M26 21 L26 26 L30 26" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </g>
          </svg>
        </div>

        <!-- Title and Message -->
        <h1 class="timeout-title">Sessione Scaduta</h1>
        <p class="timeout-message">Il tempo a disposizione per completare l'operazione è terminato.</p>

        <!-- Info Box -->
        <div class="timeout-info">
          <div class="timeout-info-title">
            <svg
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              style="color: var(--warning-500)"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
            Cosa è successo?
          </div>
          <p>
            La richiesta di autenticazione ha un tempo massimo di validità per motivi di sicurezza. Riprova per avviare
            una nuova sessione.
          </p>
        </div>

        <!-- Actions -->
        <div class="timeout-actions">
          <button class="button primary" id="retryButton" aria-label="Riprova l'autenticazione">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: inline">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
              ></path>
            </svg>
            Riprova
          </button>
        </div>
      </div>
    </div>

    <script>
      function retry() {
        window.location.href = '/';
      }

      window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('retryButton').addEventListener('click', retry);
      });
    </script>
  </body>
</html>
