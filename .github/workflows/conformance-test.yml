name: Conformance Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance-issuance:
    name: Issuance Conformance Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HUSKY: 0
      HOST: 127.0.0.1
      PORT: '3000'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda #v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Initialize data directory
        run: pnpm run init

      - name: Patch /etc/hosts for wct federation servers
        run: |
          sudo sh -c 'echo "127.0.0.1  trust-anchor.wct.example.org wallet-provider.wct.example.org credential-issuer.wct.example.org" >> /etc/hosts'

      - name: Clone wallet-conformance-test
        run: git clone --depth 1 https://github.com/pagopa/wallet-conformance-test.git /tmp/wct

      - name: Install wct dependencies
        working-directory: /tmp/wct
        run: |
          cp config.example.ini config.ini
          pnpm install
          pnpm build
          chmod +x ./bin/wct

      - name: Run issuance conformance tests
        working-directory: /tmp/wct
        run: |
          set -euo pipefail

          pnpm --dir "$GITHUB_WORKSPACE" exec nx run itw-conformance-cli:run --args="start --issuer" > /tmp/issuer.log 2>&1 &
          ISSUER_PID=$!

          cleanup() {
            if kill -0 "$ISSUER_PID" > /dev/null 2>&1; then
              kill "$ISSUER_PID" || true
            fi
            echo "----- issuer log -----"
            cat /tmp/issuer.log || true
          }
          trap cleanup EXIT

          READY=false
          for i in $(seq 1 15); do
            if curl -ksf https://localhost:3000/health > /dev/null 2>&1; then
              echo "Issuer is ready after $i attempt(s)"
              READY=true
              break
            fi
            echo "Attempt $i/15: issuer not ready, retrying in 2s..."
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            echo "ERROR: issuer did not become ready within 30s"
            exit 1
          fi

          ./bin/wct test:issuance \
            --unsafe-tls \
            --tests happy \
            --credential-issuer-uri https://127.0.0.1:3000 \
            --wallet-version V1_3

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: conformance-report-${{ github.run_id }}
          path: /tmp/wct/data/reports/
