name: Conformance Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance-issuance:
    name: Issuance Conformance Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HUSKY: 0
      HOST: 127.0.0.1
      PORT: '3000'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda #v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Initialize data directory
        run: pnpm run init

      - name: Patch /etc/hosts for wct federation servers
        run: |
          sudo sh -c 'echo "127.0.0.1  trust-anchor.wct.example.org wallet-provider.wct.example.org credential-issuer.wct.example.org" >> /etc/hosts'

      - name: Clone wallet-conformance-test
        run: git clone --depth 1 https://github.com/pagopa/wallet-conformance-test.git /tmp/wct

      - name: Install wct dependencies
        working-directory: /tmp/wct
        run: |
          cp config.example.ini config.ini
          pnpm install
          pnpm build
          chmod +x ./bin/wct

      - name: Run issuance conformance tests
        working-directory: /tmp/wct
        run: |
          set -euo pipefail

          pnpm --dir "$GITHUB_WORKSPACE" exec nx serve itw-credential-issuer > /tmp/issuer.log 2>&1 &
          ISSUER_PID=$!

          cleanup() {
            if kill -0 "$ISSUER_PID" > /dev/null 2>&1; then
              kill "$ISSUER_PID" || true
            fi
            echo "----- issuer log -----"
            cat /tmp/issuer.log || true
          }
          trap cleanup EXIT

          READY=false
          for i in $(seq 1 15); do
            if curl -ksf https://localhost:3000/health > /dev/null 2>&1; then
              echo "Issuer is ready after $i attempt(s)"
              READY=true
              break
            fi
            echo "Attempt $i/15: issuer not ready, retrying in 2s..."
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            echo "ERROR: issuer did not become ready within 30s"
            exit 1
          fi

          ./bin/wct test:issuance \
            --unsafe-tls \
            --tests happy \
            --credential-issuer-uri https://127.0.0.1:3000 \
            --wallet-version V1_3

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: conformance-report-${{ github.run_id }}
          path: /tmp/wct/data/reports/

  conformance-presentation:
    name: Presentation Conformance Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda #v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Initialize data directory
        run: pnpm run init

      - name: Patch /etc/hosts for wct federation servers
        run: |
          sudo sh -c 'echo "127.0.0.1  trust-anchor.wct.example.org relying-party.wct.example.org wallet-provider.wct.example.org credential-issuer.wct.example.org" >> /etc/hosts'

      - name: Clone wallet-conformance-test
        run: git clone --depth --branch fix/add-auth-endpoint-wallet-metadata 1 https://github.com/pagopa/wallet-conformance-test.git /tmp/wct

      - name: Install wct dependencies
        working-directory: /tmp/wct
        run: |
          cp config.example.ini config.ini
          # The local conformance runner owns the 3000-3003 port block for its
          # own services (during presentation it binds trust-anchor on 3001 and
          # relying-party on 3002). wct's global setup unconditionally binds its
          # own federation servers (trust_anchor 3001, wallet provider 3002,
          # mock issuer 3003), which would collide with the runner. Remap wct's
          # servers into the 31xx range so both sets can run side by side.
          #
          # Also trust the local runner's Trust Anchor so wct (the wallet under
          # test) can resolve the trust chain of our Relying Party's request.
          # Our RP publishes authority_hints = [https://127.0.0.1:3001] and our
          # Trust Anchor advertises that same value as its entity identifier
          # (itw-trust-anchor derives iss/sub from [trust-anchor] url), so that
          # exact URL must appear in wct's federation_trust_anchors set.
          sed -i \
            -e 's/^port = 3001$/port = 3101/' \
            -e 's/^port = 3002$/port = 3102/' \
            -e 's/^port = 3003$/port = 3103/' \
            -e 's#^federation_trust_anchors\[\] = https://trust-anchor\.wct\.example\.org:3004$#&\nfederation_trust_anchors[] = https://127.0.0.1:3001#' \
            config.ini
          pnpm install
          pnpm build
          chmod +x ./bin/wct

      # Unlike issuance (where wct drives the flow against our issuer), the
      # presentation flow is driven by the local conformance runner: it starts
      # the Relying Party + Trust Anchor, generates a presentation-request deep
      # link, and waits for a wallet to complete the OpenID4VP presentation.
      #
      # There is no human tester to open that deep link, so we install a wallet
      # hook under the clipboard command names the runner uses on Linux
      # (wl-copy / xclip / xsel). When the runner copies the generated deep link
      # to the "clipboard", the hook receives it and launches wct as the wallet
      # under test, pointed at that exact URI. See
      # .github/scripts/presentation-wallet-hook.sh.
      - name: Run presentation conformance tests
        env:
          WCT_DIR: /tmp/wct
          # The wallet hook launches wct with `--tests happy`, so it drives one
          # nominal same-device presentation per engagement. Restrict the matrix
          # to that scenario: every other presentation scenario needs a wallet
          # that either retrieves the Request Object over POST or performs the
          # wallet-side validation the negative scenario is about, and would
          # otherwise only burn its tester timeout here. Run the rest
          # interactively (`itwct test presentation` with no allow-list), or add
          # their IDs once the driver covers them.
          ITWCT_PRESENTATION_SCENARIO_IDS: WP_RP_HAPPY,WP_RP_HAPPY_POST,WP_079,WP_084,WP_085,WP_094a
        run: |
          set -euo pipefail

          # Install the wallet hook on PATH under every clipboard command the
          # runner may pick, ahead of any real clipboard tool.
          clip_bin="$(mktemp -d)"
          for cmd in wl-copy xclip xsel; do
            cp "$GITHUB_WORKSPACE/.github/scripts/presentation-wallet-hook.sh" "$clip_bin/$cmd"
            chmod +x "$clip_bin/$cmd"
          done
          export PATH="$clip_bin:$PATH"

          # The runner owns the Relying Party + Trust Anchor, emits the deep link
          # (firing the wallet hook), and passes once wct returns a valid
          # encrypted Authorization Response and follows the redirect_uri back to
          # the Relying Party.
          set +e
          pnpm run test:presentation
          test_exit=$?
          set -e

          # Give wct a moment to finish writing its own conformance report before
          # the artifact upload steps run.
          if [ -f /tmp/wct.pid ]; then
            wct_pid="$(cat /tmp/wct.pid)"
            for _ in $(seq 1 30); do
              kill -0 "$wct_pid" 2>/dev/null || break
              sleep 1
            done
          fi

          echo "----- wct wallet log -----"
          cat /tmp/wct-presentation.log || true

          exit "$test_exit"

      - name: Upload wct wallet log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: presentation-wct-log-${{ github.run_id }}
          path: /tmp/wct-presentation.log
          if-no-files-found: ignore

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: presentation-conformance-report-${{ github.run_id }}
          path: /tmp/wct/data/reports/
          if-no-files-found: ignore
